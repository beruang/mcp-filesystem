[package]
name = "mcp-filesystem-rs"
version = "0.1.0"
edition = "2021"
description = "MCP filesystem server with strict sandboxing and recursive root access control"
license = "MIT"
repository = "https://github.com/user/mcp-filesystem-rs"
keywords = ["mcp", "filesystem", "server", "sandbox", "stdio"]
categories = ["development-tools", "filesystem"]

[[bin]]
name = "mcp-filesystem-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
ignore = "0.4"
glob = "0.3"
regex = "1"
similar = "2"
mime_guess = "2"
base64 = "0.22"
